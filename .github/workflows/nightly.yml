# Builds the editor and runtime for Linux, Windows and macOS each night that the default branch
# gained a commit since the last nightly that built, and keeps them as workflow artifacts (on the
# run's page, for `retention-days`): nothing goes to GitHub Releases. Run it by hand from the
# Actions tab to build regardless.
name: Nightly

on:
  schedule:
    - cron: '0 14 * * *' # 00:00 or 01:00 in Sydney, depending on daylight saving
  workflow_dispatch:

permissions:
  contents: read
  actions: read # find the last nightly that built

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Whether the default branch moved since the commit the last successful nightly built.
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          # A successful run that skipped building still counts: it saw that commit, unchanged.
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No commits since the last nightly ($last)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The fatal-error dialog links GTK and D-Bus through pkg-config; the engine links libunwind.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libdbus-1-dev libunwind-dev
      # Zig 0.16.0 writes fetched zip archives to $ZIG_GLOBAL_CACHE_DIR/tmp and does not create
      # that directory (https://codeberg.org/ziglang/zig/issues/31964). Its HTTP client also drops
      # some GitHub release downloads; a retry continues from the packages already in the cache.
      - name: Build
        shell: bash
        run: |
          mkdir -p "${ZIG_GLOBAL_CACHE_DIR:?}/tmp"
          log=$(mktemp)
          for attempt in 1 2 3; do
            set +e
            zig build all -Doptimize=ReleaseSafe --prefix nightly 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ] && grep -q -e 'HttpConnectionClosing' -e 'ConnectionResetByPeer' -e 'ConnectionTimedOut' -e 'TemporaryNameServerFailure' "$log"; then
              echo "fetch failed (attempt $attempt); retrying"
              sleep $((attempt * 5))
              continue
            fi
            exit "$status"
          done
      # Artifacts drop file permissions, so the executables travel inside a tarball.
      - name: Pack
        shell: bash
        run: tar -czf eggy-nightly-${{ matrix.platform }}.tar.gz -C nightly .
      - uses: actions/upload-artifact@v4
        with:
          name: eggy-nightly-${{ needs.changed.outputs.date }}-${{ matrix.platform }}-${{ github.sha }}
          path: eggy-nightly-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14
