# Builds Eggy's editor, the launcher (`zig build editor`: the executable with the libraries and
# the project template and engine it unpacks for new projects), for Linux, Windows and macOS, and
# publishes them as GitHub Release assets named `eggy-<platform>.tar.gz`, which
# `scripts/get-started.sh` and `get-started.ps1` install. Each night that the default branch gained
# a commit, the `nightly` prerelease is replaced with that commit's build; pushing a `v*` tag makes
# that tag's release. Run it by hand from the Actions tab to rebuild the nightly regardless.
name: Nightly

on:
  schedule:
    - cron: '0 14 * * *' # 00:00 or 01:00 in Sydney, depending on daylight saving
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read # find the last nightly that built

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Whether the default branch moved since the commit the last successful nightly built.
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          # A successful run that skipped building still counts: it saw that commit, unchanged.
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No commits since the last nightly ($last)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            cpu: -Dcpu=baseline
          - os: windows-latest
            platform: windows-x86_64
            cpu: -Dcpu=baseline
          - os: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The engine links libunwind.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libunwind-dev
      # -Dcpu=baseline on x86_64: without it Zig builds for the runner's own CPU, and its SHA
      # extensions crash the editor with SIGILL on processors without them (an i7-8700, hashing in
      # Job.prepare). macOS keeps the native CPU, as SDL wants SDK paths for any non-native Mac.
      # Zig (seen on 0.16.0) writes fetched zip archives to $ZIG_GLOBAL_CACHE_DIR/tmp and does not create
      # that directory (https://codeberg.org/ziglang/zig/issues/31964). Its HTTP client also drops
      # some GitHub release downloads; a retry continues from the packages already in the cache.
      - name: Build
        shell: bash
        run: |
          mkdir -p "${ZIG_GLOBAL_CACHE_DIR:?}/tmp"
          log=$(mktemp)
          for attempt in 1 2 3; do
            set +e
            zig build editor -Doptimize=safe ${{ matrix.cpu }} --prefix nightly 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ] && grep -q -e 'HttpConnectionClosing' -e 'ConnectionResetByPeer' -e 'ConnectionTimedOut' -e 'TemporaryNameServerFailure' "$log"; then
              echo "fetch failed (attempt $attempt); retrying"
              sleep $((attempt * 5))
              continue
            fi
            exit "$status"
          done
      # Artifacts drop file permissions, so the executables travel inside a tarball.
      - name: Pack
        shell: bash
        run: tar -czf eggy-${{ matrix.platform }}.tar.gz -C nightly .
      - uses: actions/upload-artifact@v4
        with:
          name: eggy-${{ matrix.platform }}
          path: eggy-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # Releases serve their assets without a login, unlike workflow artifacts. The nightly is deleted
  # and made again so its tag moves to the commit just built.
  publish:
    needs: [changed, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --title "Eggy $GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${{ needs.changed.outputs.date }}" \
            --notes "Eggy's launcher built from $GITHUB_SHA. Install it with scripts/get-started.sh or get-started.ps1."
